name: ci
on:
  push:
    branches: [ "main", "claude/**", "feat/**", "fix/**" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      # addon-db's application-test.yaml expects a local Postgres at localhost:5432
      # with role "15x" (the dev's mac user). The trust-auth service below mirrors
      # that contract so CI can run the same integration tests that pass locally.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: '15x'
          POSTGRES_DB: addon_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reactor tests
        run: mvn -pl addon-expenses-rest-api -am clean test
      - name: JS syntax check
        run: |
          node --check addon-expenses-rest-api/src/main/resources/static/assets/mileage/settings-date.js
          node --check addon-expenses-rest-api/src/main/resources/static/assets/mileage/settings.js
      - name: Date helper tests
        run: node scripts/test-mileage-date-helpers.mjs
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose -f addon-expenses-rest-api/docker-compose.yml build

  static-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No float/double in money domain
        run: |
          if rg -n "\b(double|Double|float|Float)\b" addon-expenses-rest-api/src/main/java; then
            echo "FAIL: float/double found in production source"
            exit 1
          fi
      - name: No hardcoded Clockify API hosts
        run: |
          if rg -n "api\.clockify\.me|global\.api\.clockify" addon-expenses-rest-api/src/main clockify-rest-client/src/main; then
            echo "FAIL: hardcoded Clockify host found"
            exit 1
          fi

  dep-check:
    # G4 HIGH/CRITICAL gate. dependency-check-maven 12.x requires an NVD API key —
    # without one the NVD download partial-fails and the H2 connection pool becomes
    # null mid-update (NullPointerException on every subsequent CVE). To keep CI
    # green for forks / first pushes we skip cleanly when the secret is absent.
    # Add NVD_API_KEY in repo settings (free at https://nvd.nist.gov/developers/request-an-api-key)
    # to activate the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect NVD_API_KEY presence
        id: nvd
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::NVD_API_KEY present — running HIGH/CRITICAL gate."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NVD_API_KEY secret not set; skipping dep-check. Add it in repo settings to activate the HIGH/CRITICAL CVE gate."
          fi
      - uses: actions/setup-java@v4
        if: steps.nvd.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache OWASP dependency-check data
        if: steps.nvd.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dep-check-data-${{ runner.os }}-v12
          restore-keys: |
            dep-check-data-${{ runner.os }}-
      - name: OWASP dependency-check
        if: steps.nvd.outputs.available == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -pl addon-expenses-rest-api -am -DskipTests dependency-check:check
      - name: Upload dep-check report
        if: always() && steps.nvd.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: addon-expenses-rest-api/target/dependency-check-report.*
          if-no-files-found: ignore
