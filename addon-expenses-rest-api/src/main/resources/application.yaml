spring:
  application:
    name: mileage-for-clockify
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mileage_for_clockify}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

addon:
  key: ${ADDON_KEY:mileage-for-clockify}
  name: ${ADDON_NAME:Mileage for Clockify}
  description: ${ADDON_DESCRIPTION:Create and convert precise mileage reimbursements into real Clockify flat expenses.}
  base-url: ${ADDON_BASE_URL}
  enable-hsts: ${ADDON_ENABLE_HSTS:true}
  crypto:
    active-key-id: ${ADDON_CRYPTO_ACTIVE_KEY_ID}
    keys:
      k1: ${ADDON_CRYPTO_KEY_K1}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
